<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Receipt Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS for Excel Exports & Imports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_MEMBERS = [
      { id: 'dad', name: 'Μπαμπάς', role: 'Γονέας', color: 'bg-blue-600 text-white', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'mom', name: 'Μαμά', role: 'Γονέας', color: 'bg-rose-600 text-white', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'child1', name: 'Παιδί 1 (Αλέξανδρος)', role: 'Παιδί', color: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'child2', name: 'Παιδί 2 (Μαρία)', role: 'Παιδί', color: 'bg-purple-600 text-white', badge: 'bg-purple-100 text-purple-800 border-purple-300' }
    ];

    const CATEGORIES = [
      { id: 'Supermarket', label: 'Supermarket / Τρόφιμα', icon: '🛒', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'Fuel & Transport', label: 'Καύσιμο Αυτοκινήτου', icon: '⛽', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'Dining & Coffee', label: 'Εστίαση / Φαγητό Έξω', icon: '🍔', color: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'Health & Pharmacy', label: 'Φάρμακα / Ιατρικά', icon: '💊', color: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'Utilities & Bills', label: 'Utilities & Bills / Λογαριασμοί', icon: '⚡', color: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'Education & Hobbies', label: 'Σχολικά / Φροντιστήρια', icon: '📚', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      { id: 'Allowance', label: 'Χαρτζιλίκι', icon: '💵', color: 'bg-green-100 text-green-800 border-green-300' },
      { id: 'Rent', label: 'Ενοίκιο', icon: '🏠', color: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'Shopping & Gifts', label: 'Ψώνια & Δώρα', icon: '🎁', color: 'bg-pink-100 text-pink-800 border-pink-300' },
      { id: 'Cigarettes', label: 'Τσιγάρα', icon: '🚬', color: 'bg-stone-100 text-stone-800 border-stone-300' },
      { id: 'Uncategorized', label: 'Διάφορα (Προς Ταξινόμηση)', icon: '❓', color: 'bg-orange-100 text-orange-800 border-orange-300' }
    ];

    const INITIAL_RECEIPTS = [
      { id: 'rec_1', merchant: 'AB Vassilopoulos', date: '2026-11-01', category: 'Supermarket', memberId: 'mom', memberName: 'Μαμά', total: 48.65, tax: 6.20, paymentMethod: 'Card', notes: 'Ψώνια εβδομάδας' },
      { id: 'rec_2', merchant: 'EKO Gas Station', date: '2026-11-02', category: 'Fuel & Transport', memberId: 'dad', memberName: 'Μπαμπάς', total: 55.00, tax: 10.65, paymentMethod: 'Card', notes: 'Βενζίνη' },
      { id: 'rec_3', merchant: 'Φροντιστήριο Αγγλικών', date: '2026-11-03', category: 'Education & Hobbies', memberId: 'child1', memberName: 'Παιδί 1 (Αλέξανδρος)', total: 80.00, tax: 0, paymentMethod: 'Bank Transfer', notes: 'Δίδακτρα Νοεμβρίου' },
      { id: 'rec_4', merchant: 'Ενοίκιο Σπιτιού', date: '2026-11-04', category: 'Rent', memberId: 'dad', memberName: 'Μπαμπάς', total: 450.00, tax: 0, paymentMethod: 'Direct Order / Πάγια', notes: 'Μηνιαίο ενοίκιο' },
      { id: 'rec_5', merchant: 'Χαρτζιλίκι Αλέξανδρου', date: '2026-11-05', category: 'Allowance', memberId: 'child1', memberName: 'Παιδί 1 (Αλέξανδρος)', total: 15.00, tax: 0, paymentMethod: 'Cash', notes: 'Εβδομαδιαίο χαρτζιλίκι' },
      { id: 'rec_6', merchant: 'Περίπτερο / Τσιγάρα', date: '2026-11-06', category: 'Cigarettes', memberId: 'dad', memberName: 'Μπαμπάς', total: 4.60, tax: 0, paymentMethod: 'Cash', notes: '' },
      { id: 'rec_7', merchant: 'Pharmacy Central', date: '2026-11-07', category: 'Health & Pharmacy', memberId: 'child2', memberName: 'Μαρία', total: 22.40, tax: 1.30, paymentMethod: 'Card', notes: 'Βιταμίνες' },
      { id: 'rec_8', merchant: 'Αγορά Δώρου', date: '2026-11-08', category: 'Shopping & Gifts', memberId: 'mom', memberName: 'Μαμά', total: 35.00, tax: 6.70, paymentMethod: 'Card', notes: 'Δώρο γενεθλίων' }
    ];

    function App() {
      const [receipts, setReceipts] = useState(() => {
        const saved = localStorage.getItem('family_receipts_v6');
        return saved ? JSON.parse(saved) : INITIAL_RECEIPTS;
      });

      const [members] = useState(DEFAULT_MEMBERS);
      const [selectedMember, setSelectedMember] = useState('dad');
      const [isScanning, setIsScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [memberFilter, setMemberFilter] = useState('All');
      const [isListening, setIsListening] = useState(false);

      const cameraInputRef = useRef(null);
      const fileInputRef = useRef(null);
      const excelImportRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('family_receipts_v6', JSON.stringify(receipts));
      }, [receipts]);

      const downloadTemplate = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;
        const wb = XLSX.utils.book_new();
        const templateRows = [
          { 'Ημερομηνία (YYYY-MM-DD)': '2026-11-01', 'Κατάστημα / Περιγραφή': 'AB Vassilopoulos', 'Κατηγορία': 'Supermarket', 'Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)': 'Μαμά', 'Σύνολο (€)': 48.65, 'Τρόπος Πληρωμής': 'Card', 'Σημειώσεις': 'Ψώνια' },
          { 'Ημερομηνία (YYYY-MM-DD)': '2026-11-02', 'Κατάστημα / Περιγραφή': 'Ενοίκιο', 'Κατηγορία': 'Rent', 'Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)': 'Μπαμπάς', 'Σύνολο (€)': 450.00, 'Τρόπος Πληρωμής': 'Πάγια', 'Σημειώσεις': 'Ενοίκιο Νοεμβρίου' }
        ];
        const ws = XLSX.utils.json_to_sheet(templateRows);
        XLSX.utils.book_append_sheet(wb, ws, 'Πρότυπο Εισαγωγής');
        XLSX.writeFile(wb, `Receipts_Template_Nov_1_to_8.xlsx`);
      };

      const handleExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const XLSX = window.XLSX;
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws);

          const importedReceipts = data.map((row, index) => {
            const mName = row['Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)'] || row['Μέλος'] || 'Μπαμπάς';
            const mObj = members.find(m => m.name.toLowerCase().includes(mName.toLowerCase())) || members[0];
            return {
              id: `rec_imp_${Date.now()}_${index}`,
              merchant: row['Κατάστημα / Περιγραφή'] || row['Κατάστημα'] || 'Εισαγωγή Excel',
              date: row['Ημερομηνία (YYYY-MM-DD)'] || row['Ημερομηνία'] || new Date().toISOString().slice(0, 10),
              category: row['Κατηγορία'] || 'Uncategorized',
              memberId: mObj.id,
              memberName: mObj.name,
              total: parseFloat(row['Σύνολο (€)'] || row['Σύνολο'] || 0),
              tax: 0,
              paymentMethod: row['Τρόπος Πληρωμής'] || 'Μετρητά',
              notes: row['Σημειώσεις'] || 'Εισαγωγή από Excel'
            };
          });

          setReceipts((prev) => [...importedReceipts, ...prev]);
          alert(`Εισήχθησαν επιτυχώς ${importedReceipts.length} εγγραφές!`);
        };
        reader.readAsBinaryString(file);
      };

      const exportToExcel = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;

        const wb = XLSX.utils.book_new();
        const receiptRows = receipts.map((r) => ({
          'ID': r.id,
          'Ημερομηνία': r.date,
          'Κατάστημα / Περιγραφή': r.merchant,
          'Κατηγορία': r.category,
          'Μέλος': r.memberName,
          'Σύνολο (€)': r.total,
          'Τρόπος Πληρωμής': r.paymentMethod,
          'Σημειώσεις': r.notes || ''
        }));
        const ws1 = XLSX.utils.json_to_sheet(receiptRows);
        XLSX.utils.book_append_sheet(wb, ws1, 'Αποδείξεις');

        XLSX.writeFile(wb, `Family_Expenses_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const handleVoiceInput = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('Η φωνητική αναγνώριση δεν υποστηρίζεται στο πρόγραμμα περιήγησής σας.');
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'el-GR';

        setIsListening(true);
        recognition.start();

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setIsListening(false);
          alert(`Ακούστηκε: "${transcript}"`);

          const currentMember = members.find(m => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_voice_${Date.now()}`,
            merchant: transcript,
            date: new Date().toISOString().slice(0, 10),
            category: 'Uncategorized',
            memberId: currentMember.id,
            memberName: currentMember.name,
            total: 10.00,
            tax: 0,
            paymentMethod: 'Φωνητική Καταχώρηση',
            notes: `Φωνητικό: ${transcript}`
          };
          setReceipts(prev => [newRec, ...prev]);
        };

        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
      };

      const addQuickExpense = (category, defaultName, defaultAmount) => {
        const mObj = members.find((m) => m.id === selectedMember) || members[0];
        const newRec = {
          id: `rec_quick_${Date.now()}`,
          merchant: defaultName,
          date: new Date().toISOString().slice(0, 10),
          category: category,
          memberId: mObj.id,
          memberName: mObj.name,
          total: defaultAmount,
          tax: 0,
          paymentMethod: 'Πάγια / Μετρητά',
          notes: 'Γρήγορη καταχώρηση χωρίς απόδειξη'
        };
        setReceipts(prev => [newRec, ...prev]);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsScanning(true);
        setTimeout(() => {
          const mObj = members.find((m) => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_${Date.now()}`,
            merchant: 'Νέα Απόδειξη (Σάρωση)',
            date: new Date().toISOString().slice(0, 10),
            category: 'Uncategorized',
            memberId: mObj.id,
            memberName: mObj.name,
            total: 24.50,
            tax: 3.20,
            paymentMethod: 'Card',
            notes: 'Σαρώθηκε από φωτογραφία'
          };
          setReceipts((prev) => [newRec, ...prev]);
          setIsScanning(false);
        }, 1000);
      };

      const changeCategory = (receiptId, newCat) => {
        setReceipts(prev => prev.map(r => r.id === receiptId ? { ...r, category: newCat } : r));
      };

      const deleteReceipt = (id) => {
        setReceipts((prev) => prev.filter((r) => r.id !== id));
      };

      const grandTotal = useMemo(() => receipts.reduce((acc, r) => acc + r.total, 0), [receipts]);

      const memberBreakdown = useMemo(() => {
        return members.map((m) => {
          const mRecs = receipts.filter((r) => r.memberId === m.id);
          const sum = mRecs.reduce((acc, r) => acc + r.total, 0);
          const percent = grandTotal > 0 ? (sum / grandTotal) * 100 : 0;
          return { ...m, count: mRecs.length, total: sum, percent };
        });
      }, [receipts, members, grandTotal]);

      const categoryBreakdown = useMemo(() => {
        return CATEGORIES.map((cat) => {
          const catRecs = receipts.filter((r) => r.category === cat.id);
          const sum = catRecs.reduce((acc, r) => acc + r.total, 0);
          const percent = grandTotal > 0 ? (sum / grandTotal) * 100 : 0;
          return { ...cat, count: catRecs.length, total: sum, percent };
        });
      }, [receipts, grandTotal]);

      const dateBreakdown = useMemo(() => {
        const map = {};
        receipts.forEach((r) => {
          if (!map[r.date]) map[r.date] = 0;
          map[r.date] += r.total;
        });
        return Object.keys(map).sort().reverse().map(d => ({ date: d, total: map[d] }));
      }, [receipts]);

      const filteredReceipts = useMemo(() => {
        return receipts.filter((r) => {
          const matchesSearch = r.merchant.toLowerCase().includes(searchTerm.toLowerCase()) || r.memberName.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = categoryFilter === 'All' || r.category === categoryFilter;
          const matchesMember = memberFilter === 'All' || r.memberId === memberFilter;
          return matchesSearch && matchesCategory && matchesMember;
        });
      }, [receipts, searchTerm, categoryFilter, memberFilter]);

      const uncategorizedReceipts = useMemo(() => {
        return receipts.filter(r => r.category === 'Uncategorized');
      }, [receipts]);

      return (
        <div className="min-h-screen pb-16">
          <input type="file" ref={cameraInputRef} onChange={handleFileUpload} accept="image/*" capture="environment" className="hidden" />
          <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*" className="hidden" />
          <input type="file" ref={excelImportRef} onChange={handleExcelImport} accept=".xlsx,.xls" className="hidden" />

          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
