<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Receipt Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS for Excel Exports & Imports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_MEMBERS = [
      { id: 'nikos', name: 'Νίκος', role: 'Γονέας', color: 'bg-blue-600 text-white', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'anthi', name: 'Ανθή', role: 'Γονέας', color: 'bg-rose-600 text-white', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'theodora', name: 'Θεοδώρα', role: 'Παιδί', color: 'bg-purple-600 text-white', badge: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'aggeliki', name: 'Αγγελική', role: 'Παιδί', color: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'christina', name: 'Χριστίνα', role: 'Παιδί', color: 'bg-teal-600 text-white', badge: 'bg-teal-100 text-teal-800 border-teal-300' }
    ];

    const BENEFICIARY_OPTIONS = [
      'Όλη η Οικογένεια',
      'Κορίτσια (Αγγελική & Χριστίνα 50-50)',
      'Νίκος',
      'Ανθή',
      'Θεοδώρα',
      'Αγγελική',
      'Χριστίνα'
    ];

    const CATEGORIES = [
      { id: 'Supermarket', label: 'Υπεραγορά / Τρόφιμα', icon: '🛒', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'Fuel & Transport', label: 'Καύσιμο Αυτοκινήτου', icon: '⛽', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'Dining & Coffee', label: 'Εστίαση / Φαγητό Έξω', icon: '🍔', color: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'Health & Pharmacy', label: 'Φάρμακα / Ιατρικά', icon: '💊', color: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'Utilities & Bills', label: 'Λογαριασμοί / Bills', icon: '⚡', color: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'Education & Hobbies', label: 'Σχολικά / Φροντιστήρια', icon: '📚', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      { id: 'Allowance', label: 'Χαρτζιλίκι', icon: '💵', color: 'bg-green-100 text-green-800 border-green-300' },
      { id: 'Rent', label: 'Ενοίκιο', icon: '🏠', color: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'Loans & Tax', label: 'Δάνεια - Εφορία', icon: '🏦', color: 'bg-red-100 text-red-800 border-red-300' },
      { id: 'Shopping & Gifts', label: 'Ψώνια & Δώρα', icon: '🎁', color: 'bg-pink-100 text-pink-800 border-pink-300' },
      { id: 'Cigarettes', label: 'Τσιγάρα', icon: '🚬', color: 'bg-stone-100 text-stone-800 border-stone-300' },
      { id: 'Uncategorized', label: 'Διάφορα (Ταξινόμηση)', icon: '❓', color: 'bg-orange-100 text-orange-800 border-orange-300' }
    ];

    const INITIAL_RECEIPTS = [
      { id: 'rec_1', merchant: 'AB Vassilopoulos', subcategory: 'Ψώνια Εβδομάδας', date: '28/12/26', category: 'Supermarket', memberId: 'anthi', memberName: 'Ανθή', beneficiary: 'Όλη η Οικογένεια', total: 48.65, paymentMethod: 'Card', notes: '' },
      { id: 'rec_2', merchant: 'EKO Gas Station', subcategory: 'Βενζίνη', date: '28/12/26', category: 'Fuel & Transport', memberId: 'nikos', memberName: 'Νίκος', beneficiary: 'Όλη η Οικογένεια', total: 55.00, paymentMethod: 'Card', notes: '' },
      { id: 'rec_3', merchant: 'Φροντιστήριο Αγγλικών', subcategory: 'Δίδακτρα', date: '28/12/26', category: 'Education & Hobbies', memberId: 'nikos', memberName: 'Νίκος', beneficiary: 'Θεοδώρα', total: 80.00, paymentMethod: 'Bank Transfer', notes: '' },
      { id: 'rec_4', merchant: 'Ενοίκιο Σπιτιού', subcategory: 'Μηνιαίο Ενοίκιο', date: '28/12/26', category: 'Rent', memberId: 'nikos', memberName: 'Νίκος', beneficiary: 'Όλη η Οικογένεια', total: 450.00, paymentMethod: 'Direct Order / Πάγια', notes: '' },
      { id: 'rec_5', merchant: 'Αγορά Ρούχων', subcategory: 'Μπλούζες', date: '28/12/26', category: 'Shopping & Gifts', memberId: 'anthi', memberName: 'Ανθή', beneficiary: 'Κορίτσια (Αγγελική & Χριστίνα 50-50)', total: 60.00, paymentMethod: 'Card', notes: '' },
      { id: 'rec_6', merchant: 'Pharmacy Central', subcategory: 'Βιταμίνες', date: '28/12/26', category: 'Health & Pharmacy', memberId: 'anthi', memberName: 'Ανθή', beneficiary: 'Χριστίνα', total: 22.40, paymentMethod: 'Card', notes: '' }
    ];

    function App() {
      const [receipts, setReceipts] = useState(() => {
        const saved = localStorage.getItem('family_receipts_v12');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed.map(r => ({ ...r, beneficiary: r.beneficiary || 'Όλη η Οικογένεια' }));
        }
        return INITIAL_RECEIPTS;
      });

      const [members] = useState(DEFAULT_MEMBERS);
      const [selectedMember, setSelectedMember] = useState('nikos');
      const [isScanning, setIsScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [memberFilter, setMemberFilter] = useState('All');
      const [beneficiaryFilter, setBeneficiaryFilter] = useState('All');
      const [isListening, setIsListening] = useState(false);

      const [editingReceipt, setEditingReceipt] = useState(null);

      const [showFormModal, setShowFormModal] = useState(false);
      const [formData, setFormData] = useState({
        date: '28/12/26',
        merchant: '',
        subcategory: '',
        category: 'Supermarket',
        memberId: 'nikos',
        beneficiary: 'Όλη η Οικογένεια',
        total: '',
        paymentMethod: 'Card',
        notes: ''
      });

      const cameraInputRef = useRef(null);
      const fileInputRef = useRef(null);
      const excelImportRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('family_receipts_v12', JSON.stringify(receipts));
      }, [receipts]);

      const downloadTemplate = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;
        const wb = XLSX.utils.book_new();
        const templateRows = [
          { 'Ημερομηνία (DD/MM/YY)': '28/12/26', 'Κατάστημα / Παραλήπτης': 'AB Vassilopoulos', 'Υποκατηγορία / Περιγραφή': 'Ψώνια', 'Κατηγορία Εξόδου': 'Υπεραγορά', 'Πληρωτής': 'Ανθή', 'Ποιον αφορά': 'Όλη η Οικογένεια', 'Σύνολο (€)': 48.65, 'Τρόπος Πληρωμής': 'Card' },
          { 'Ημερομηνία (DD/MM/YY)': '', 'Κατάστημα / Παραλήπτης': '', 'Υποκατηγορία / Περιγραφή': '', 'Κατηγορία Εξόδου': 'Καύσιμο Αυτοκινήτου', 'Πληρωτής': '', 'Ποιον αφορά': '', 'Σύνολο (€)': 25.00, 'Τρόπος Πληρωμής': '' }
        ];
        const ws = XLSX.utils.json_to_sheet(templateRows);
        XLSX.utils.book_append_sheet(wb, ws, 'Πρότυπο Εισαγωγής');
        XLSX.writeFile(wb, `Receipts_Template.xlsx`);
      };

      const handleExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const XLSX = window.XLSX;
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws);

          const importedReceipts = [];
          let skippedRows = 0;

          data.forEach((row, index) => {
            const rawAmount = row['Σύνολο (€)'] ?? row['Σύνολο'] ?? row['Ποσό (€)'] ?? row['Ποσό'] ?? row['Amount'] ?? row['TOTAL'];
            const parsedTotal = parseFloat(rawAmount);
            const rawCat = (row['Κατηγορία Εξόδου'] ?? row['Κατηγορία'] ?? row['Category'] ?? '').toString().trim();

            if (isNaN(parsedTotal) || parsedTotal <= 0 || !rawCat) {
              skippedRows++;
              return;
            }

            let categoryKey = 'Uncategorized';
            const catLower = rawCat.toLowerCase();
            
            const matched = CATEGORIES.find(c => 
              c.id.toLowerCase() === catLower || 
              c.label.toLowerCase().includes(catLower)
            );

            if (matched) {
              categoryKey = matched.id;
            } else if (catLower.includes('υπεραγορ') || catLower.includes('supermarket') || catLower.includes('τροφιμ')) {
              categoryKey = 'Supermarket';
            } else if (catLower.includes('δανει') || catLower.includes('εφορια') || catLower.includes('εφορία')) {
              categoryKey = 'Loans & Tax';
            } else if (catLower.includes('καυσιμ') || catLower.includes('βενζιν')) {
              categoryKey = 'Fuel & Transport';
            } else if (catLower.includes('εστιασ') || catLower.includes('φαγητ') || catLower.includes('καφε')) {
              categoryKey = 'Dining & Coffee';
            } else if (catLower.includes('φαρμακ') || catLower.includes('ιατρικ')) {
              categoryKey = 'Health & Pharmacy';
            } else if (catLower.includes('λογαριασμ') || catLower.includes('bills')) {
              categoryKey = 'Utilities & Bills';
            } else if (catLower.includes('σχολικ') || catLower.includes('φροντιστηρ')) {
              categoryKey = 'Education & Hobbies';
            } else if (catLower.includes('χαρτζιλικ')) {
              categoryKey = 'Allowance';
            } else if (catLower.includes('ενοικιο') || catLower.includes('ενοίκιο')) {
              categoryKey = 'Rent';
            } else if (catLower.includes('ψωνια') || catLower.includes('δωρα') || catLower.includes('ρούχα')) {
              categoryKey = 'Shopping & Gifts';
            } else if (catLower.includes('τσιγαρ')) {
              categoryKey = 'Cigarettes';
            }

            const mName = (row['Πληρωτής'] ?? row['Μέλος'] ?? row['Member'] ?? '').toString().trim();
            const mObj = members.find(m => m.name.toLowerCase().includes(mName.toLowerCase())) || members[0];

            let ben = (row['Ποιον αφορά'] ?? row['Δικαιούχος'] ?? '').toString().trim();
            if (!ben) {
              ben = 'Όλη η Οικογένεια';
            } else if (ben.toLowerCase().includes('κοριτσ')) {
              ben = 'Κορίτσια (Αγγελική & Χριστίνα 50-50)';
            }

            const merchantName = (row['Κατάστημα / Παραλήπτης'] ?? row['Κατάστημα / Περιγραφή'] ?? row['Κατάστημα'] ?? row['Merchant'] ?? '').toString().trim() || 'Εισαγωγή Excel';
            const subcatName = (row['Υποκατηγορία / Περιγραφή'] ?? row['Υποκατηγορία'] ?? row['Περιγραφή'] ?? '').toString().trim();
            const dateStr = (row['Ημερομηνία (DD/MM/YY)'] ?? row['Ημερομηνία'] ?? row['Date'] ?? '').toString().trim() || '28/12/26';
            const paymentMethodStr = (row['Τρόπος Πληρωμής'] ?? row['Πληρωμή'] ?? '').toString().trim() || 'Μετρητά';

            importedReceipts.push({
              id: `rec_imp_${Date.now()}_${index}`,
              merchant: merchantName,
              subcategory: subcatName,
              date: dateStr,
              category: categoryKey,
              memberId: mObj.id,
              memberName: mObj.name,
              beneficiary: ben,
              total: parsedTotal,
              paymentMethod: paymentMethodStr,
              notes: 'Εισαγωγή από Excel'
            });
          });

          setReceipts((prev) => [...importedReceipts, ...prev]);
          alert(`Εισήχθησαν επιτυχώς ${importedReceipts.length} εγγραφές!${skippedRows > 0 ? ` (${skippedRows} γραμμές παραλείφθηκαν επειδή δεν είχαν Ποσό ή Κατηγορία)` : ''}`);
        };
        reader.readAsBinaryString(file);
      };

      const exportToExcel = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;

        const wb = XLSX.utils.book_new();
        const receiptRows = receipts.map((r) => ({
          'ID': r.id,
          'Ημερομηνία': r.date,
          'Κατάστημα / Παραλήπτης': r.merchant,
          'Υποκατηγορία / Περιγραφή': r.subcategory || '',
          'Κατηγορία Εξόδου': r.category === 'Supermarket' ? 'Υπεραγορά' : (r.category === 'Loans & Tax' ? 'Δάνεια - Εφορία' : r.category),
          'Πληρωτής': r.memberName,
          'Ποιον αφορά': r.beneficiary || 'Όλη η Οικογένεια',
          'Σύνολο (€)': r.total,
          'Τρόπος Πληρωμής': r.paymentMethod
        }));
        const ws1 = XLSX.utils.json_to_sheet(receiptRows);
        XLSX.utils.book_append_sheet(wb, ws1, 'Αποδείξεις');

        XLSX.writeFile(wb, `Family_Expenses_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const handleVoiceInput = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('Η φωνητική αναγνώριση δεν υποστηρίζεται στο πρόγραμμα περιήγησής σας.');
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'el-GR';

        setIsListening(true);
        recognition.start();

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setIsListening(false);
          alert(`Ακούστηκε: "${transcript}"`);

          let detectedBen = 'Όλη η Οικογένεια';
          if (transcript.toLowerCase().includes('κορίτσια') || transcript.toLowerCase().includes('κοριτσια')) {
            detectedBen = 'Κορίτσια (Αγγελική & Χριστίνα 50-50)';
          }

          const currentMember = members.find(m => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_voice_${Date.now()}`,
            merchant: transcript,
            subcategory: 'Φωνητική Εγγραφή',
            date: '28/12/26',
            category: 'Uncategorized',
            memberId: currentMember.id,
            memberName: currentMember.name,
            beneficiary: detectedBen,
            total: 10.00,
            paymentMethod: 'Μετρητά',
            notes: `Φωνητικό: ${transcript}`
          };
          setReceipts(prev => [newRec, ...prev]);
        };

        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
      };

      const addQuickExpense = (category, defaultName, defaultSubcat, defaultAmount, defaultBeneficiary = 'Όλη η Οικογένεια') => {
        const mObj = members.find((m) => m.id === selectedMember) || members[0];
        const newRec = {
          id: `rec_quick_${Date.now()}`,
          merchant: defaultName,
          subcategory: defaultSubcat,
          date: '28/12/26',
          category: category,
          memberId: mObj.id,
          memberName: mObj.name,
          beneficiary: defaultBeneficiary || 'Όλη η Οικογένεια',
          total: defaultAmount,
          paymentMethod: 'Πάγια / Μετρητά',
          notes: 'Γρήγορη καταχώρηση'
        };
        setReceipts(prev => [newRec, ...prev]);
      };

      const handleCreateManualExpense = (e) => {
        e.preventDefault();
        const mObj = members.find(m => m.id === formData.memberId) || members[0];
        const newRec = {
          id: `rec_manual_${Date.now()}`,
          merchant: formData.merchant || 'Χειροκίνητη Εγγραφή',
          subcategory: formData.subcategory,
          date: formData.date || '28/12/26',
          category: formData.category,
          memberId: mObj.id,
          memberName: mObj.name,
          beneficiary: formData.beneficiary || 'Όλη η Οικογένεια',
          total: parseFloat(formData.total || 0),
          paymentMethod: formData.paymentMethod,
          notes: formData.notes
        };
        setReceipts(prev => [newRec, ...prev]);
        setShowFormModal(false);
        setFormData({
          date: '28/12/26',
          merchant: '',
          subcategory: '',
          category: 'Supermarket',
          memberId: selectedMember,
          beneficiary: 'Όλη η Οικογένεια',
          total: '',
          paymentMethod: 'Card',
          notes: ''
        });
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsScanning(true);
        setTimeout(() => {
          const mObj = members.find((m) => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_${Date.now()}`,
            merchant: 'Νέα Απόδειξη (Σάρωση)',
            subcategory: 'Από Φωτογραφία',
            date: '28/12/26',
            category: 'Uncategorized',
            memberId: mObj.id,
            memberName: mObj.name,
            beneficiary: 'Όλη η Οικογένεια',
            total: 24.50,
            paymentMethod: 'Card',
            notes: 'Σαρώθηκε από φωτογραφία'
          };
          setReceipts((prev) => [newRec, ...prev]);
          setIsScanning(false);
        }, 1000);
      };

      const changeCategory = (receiptId, newCat) => {
        setReceipts(prev => prev.map(r => r.id === receiptId ? { ...r, category: newCat } : r));
      };

      const saveEditedReceipt = (e) => {
        e.preventDefault();
        const updatedBeneficiary = editingReceipt.beneficiary || 'Όλη η Οικογένεια';
        setReceipts(prev => prev.map(r => r.id === editingReceipt.id ? { ...editingReceipt, beneficiary: updatedBeneficiary } : r));
        setEditingReceipt(null);
      };

      const deleteReceipt = (id) => {
        if (confirm('Θέλετε σίγουρα να ακυρώσετε/διαγράψετε αυτή την εγγραφή;')) {
          setReceipts((prev) => prev.filter((r) => r.id !== id));
          if (editingReceipt?.id === id) setEditingReceipt(null);
        }
      };

      const grandTotal = useMemo(() => receipts.reduce((acc, r) => acc + r.total, 0), [receipts]);

      const mtdStats = useMemo(() => {
        const today = new Date();
        const currentMonth = today.getMonth();
        const currentYear = today.getFullYear();
        const dayOfMonth = today.getDate();

        const mtdReceipts = receipts.filter(r => {
          if (!r.date) return true;
          const parts = r.date.split(/[\/\-]/);
          if (parts.length === 3) {
            let year = parseInt(parts[0].length === 4 ? parts[0] : `20${parts[2]}`);
            let month = parseInt(parts[1]) - 1;
            return month === currentMonth && year === currentYear;
          }
          return true;
        });

        const totalMTD = mtdReceipts.reduce((acc, r) => acc + r.total, 0);
        const dailyAverage = dayOfMonth > 0 ? totalMTD / dayOfMonth : totalMTD;

        return {
          total: totalMTD,
          count: mtdReceipts.length,
          dayOfMonth,
          dailyAverage,
          lastUpdated: today.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' })
        };
      }, [receipts]);

      const beneficiaryBreakdown = useMemo(() => {
        const counts = {};
        BENEFICIARY_OPTIONS.forEach(b => counts[b] = 0);

        receipts.forEach(r => {
          const ben = r.beneficiary || 'Όλη η Οικογένεια';
          if (counts[ben] !== undefined) {
            counts[ben] += r.total;
          } else {
            counts['Όλη η Οικογένεια'] += r.total;
          }
        });

        return BENEFICIARY_OPTIONS.map(b => ({
          name: b,
          total: counts[b] || 0,
          percent: grandTotal > 0 ? ((counts[b] || 0) / grandTotal) * 100 : 0
        }));
      }, [receipts, grandTotal]);

      const memberBreakdown = useMemo(() => {
        return members.map((m) => {
          const mRecs = receipts.filter((r) => r.memberId === m.id);
          const payerSum = mRecs.reduce((acc, r) => acc + r.total, 0);

          const beneficiarySum = receipts.reduce((acc, r) => {
            const ben = r.beneficiary || 'Όλη η Οικογένεια';
            if (ben === m.name) {
              return acc + r.total;
            } else if ((m.id === 'aggeliki' || m.id === 'christina') && (ben.includes('Κορίτσια') || ben.toLowerCase().includes('κοριτσ'))) {
              return acc + (r.total / 2);
            }
            return acc;
          }, 0);

          const percent = grandTotal > 0 ? (payerSum / grandTotal) * 100 : 0;
          return { ...m, count: mRecs.length, total: payerSum, beneficiarySum, percent };
        });
      }, [receipts, members, grandTotal]);

      const categoryBreakdown = useMemo(() => {
        return CATEGORIES.map((cat) => {
          const catRecs = receipts.filter((r) => r.category === cat.id);
          const sum = catRecs.reduce((acc, r) => acc + r.total, 0);
          const percent = grandTotal > 0 ? (sum / grandTotal) * 100 : 0;
          return { ...cat, count: catRecs.length, total: sum, percent };
        });
      }, [receipts, grandTotal]);

      const filteredReceipts = useMemo(() => {
        return receipts.filter((r) => {
          const ben = r.beneficiary || 'Όλη η Οικογένεια';
          const matchesSearch = r.merchant.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                (r.subcategory && r.subcategory.toLowerCase().includes(searchTerm.toLowerCase())) ||
                                r.memberName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                ben.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = categoryFilter === 'All' || r.category === categoryFilter;
          const matchesMember = memberFilter === 'All' || r.memberId === memberFilter;
          const matchesBeneficiary = beneficiaryFilter === 'All' || 
                                     ben === beneficiaryFilter ||

                            </td>
                            <td className="py-3 px-4 bg-indigo-50/30">
                              <span className={`px-2 py-0.5 rounded-md text-xs font-bold border ${isGirls ? 'bg-pink-100 text-pink-800 border-pink-300' : 'bg-indigo-100 text-indigo-800 border-indigo-200'}`}>
                                🎯 {benText}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-right font-black text-slate-900">€{r.total.toFixed(2)}</td>
                            <td className="py-3 px-4 text-center space-x-1">
                              <button onClick={() => setEditingReceipt({ ...r })} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition">
                                ✏️
                              </button>
                              <button onClick={() => deleteReceipt(r.id)} className="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-lg transition">
                                🗑️
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {/* MANUAL ENTRY FORM MODAL */}
            {showFormModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                  <div className="flex items-center justify-between border-b pb-3">
                    <h3 className="text-base font-bold text-slate-800">➕ Χειροκίνητη Καταχώρηση Εξόδου</h3>
                    <button onClick={() => setShowFormModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                  </div>

                  <form onSubmit={handleCreateManualExpense} className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Ημερομηνία</label>
                        <input
                          type="text"
                          value={formData.date}
                          onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                          placeholder="28/12/26"
                          required
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Ποσό (€)</label>
                        <input
                          type="number"
                          step="0.01"
                          value={formData.total}
                          onChange={(e) => setFormData({ ...formData, total: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs font-bold"
                          placeholder="0.00"
                          required
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Κατάστημα / Παραλήπτης</label>
                        <input
                          type="text"
                          value={formData.merchant}
                          onChange={(e) => setFormData({ ...formData, merchant: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                          placeholder="π.χ. AB Vassilopoulos"
                          required
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Υποκατηγορία / Περιγραφή</label>
                        <input
                          type="text"
                          value={formData.subcategory}
                          onChange={(e) => setFormData({ ...formData, subcategory: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                          placeholder="π.χ. Ψώνια εβδομάδας"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Κατηγορία Εξόδου</label>
                        <select
                          value={formData.category}
                          onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        >
                          {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-indigo-700 block mb-1">🎯 Ποιον αφορά;</label>
                        <select
                          value={formData.beneficiary}
                          onChange={(e) => setFormData({ ...formData, beneficiary: e.target.value })}
                          className="w-full px-3 py-2 border border-indigo-300 bg-indigo-50 rounded-xl text-xs font-bold text-indigo-900"
                        >
                          {BENEFICIARY_OPTIONS.map(b => <option key={b} value={b}>{b}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Πληρωτής (Μέλος)</label>
                        <select
                          value={formData.memberId}
                          onChange={(e) => setFormData({ ...formData, memberId: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        >
                          {members.map(m => <option key={m.id} value={m.id}>{m.name} ({m.role})</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Τρόπος Πληρωμής</label>
                        <select
                          value={formData.paymentMethod}
                          onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        >
                          <option value="Card">Κάρτα</option>
                          <option value="Μετρητά">Μετρητά</option>
                          <option value="Πάγια">Πάγια Εντολή</option>
                          <option value="Bank Transfer">Κατάθεση</option>
                        </select>
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t">
                      <button type="button" onClick={() => setShowFormModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">Ακύρωση</button>
                      <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">Προσθήκη Εξόδου</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT ITEM MODAL */}
            {editingReceipt && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                  <div className="flex items-center justify-between border-b pb-3">
                    <h3 className="text-base font-bold text-slate-800">✏️ Διόρθωση Εγγραφής</h3>
                    <button onClick={() => setEditingReceipt(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                  </div>

                  <form onSubmit={saveEditedReceipt} className="space-y-3">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Ημερομηνία</label>
                        <input
                          type="text"
                          value={editingReceipt.date}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, date: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Ποσό (€)</label>
                        <input
                          type="number"
                          step="0.01"
                          value={editingReceipt.total}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, total: parseFloat(e.target.value || 0) })}
                          className="w-full px-3 py-2 border rounded-xl text-xs font-bold"
                          required
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Κατάστημα / Παραλήπτης</label>
                        <input
                          type="text"
                          value={editingReceipt.merchant}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, merchant: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Υποκατηγορία / Περιγραφή</label>
                        <input
                          type="text"
                          value={editingReceipt.subcategory || ''}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, subcategory: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Κατηγορία</label>
                        <select
                          value={editingReceipt.category}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, category: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        >
                          {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-indigo-700 block mb-1">🎯 Ποιον αφορά;</label>
                        <select
                          value={editingReceipt.beneficiary || 'Όλη η Οικογένεια'}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, beneficiary: e.target.value })}
                          className="w-full px-3 py-2 border border-indigo-300 bg-indigo-50 rounded-xl text-xs font-bold text-indigo-900"
                        >
                          {BENEFICIARY_OPTIONS.map(b => <option key={b} value={b}>{b}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Πληρωτής</label>
                        <select
                          value={editingReceipt.memberId}
                          onChange={(e) => {
                            const mObj = members.find(m => m.id === e.target.value);
                            setEditingReceipt({ ...editingReceipt, memberId: mObj.id, memberName: mObj.name });
                          }}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        >
                          {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-500 block mb-1">Τρόπος Πληρωμής</label>
                        <input
                          type="text"
                          value={editingReceipt.paymentMethod}
                          onChange={(e) => setEditingReceipt({ ...editingReceipt, paymentMethod: e.target.value })}
                          className="w-full px-3 py-2 border rounded-xl text-xs"
                        />
                      </div>
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t">
                      <button
                        type="button"
                        onClick={() => deleteReceipt(editingReceipt.id)}
                        className="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-xl text-xs font-bold"
                      >
                        🗑️ Ακύρωση / Διαγραφή
                      </button>
                      <div className="flex gap-2">
                        <button type="button" onClick={() => setEditingReceipt(null)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">Πίσω</button>
                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">Αποθήκευση</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
