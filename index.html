<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Receipt Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS for Excel Exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_MEMBERS = [
      { id: 'dad', name: 'Μπαμπάς', role: 'Γονέας', color: 'bg-blue-500 text-white', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'mom', name: 'Μαμά', role: 'Γονέας', color: 'bg-rose-500 text-white', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'child1', name: 'Παιδί 1 (Αλέξανδρος)', role: 'Παιδί', color: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'child2', name: 'Παιδί 2 (Μαρία)', role: 'Παιδί', color: 'bg-purple-500 text-white', badge: 'bg-purple-100 text-purple-800 border-purple-300' }
    ];

    const CATEGORIES = [
      { id: 'Supermarket', label: 'Supermarket / Τρόφιμα', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'Fuel & Transport', label: 'Fuel & Transport / Καύσιμα', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'Dining & Coffee', label: 'Dining & Coffee / Εστίαση', color: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'Business & Office', label: 'Business & Office / Γραφείο', color: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'Health & Pharmacy', label: 'Health & Pharmacy / Φαρμακείο', color: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'Utilities & Bills', label: 'Utilities & Bills / Λογαριασμοί', color: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'Education & Hobbies', label: 'Education & Hobbies / Σχολικά', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      { id: 'Entertainment & Leisure', label: 'Entertainment & Leisure / Ψυχαγωγία', color: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300' },
      { id: 'Other Expenses', label: 'Other Expenses / Διάφορα', color: 'bg-gray-100 text-gray-800 border-gray-300' }
    ];

    const INITIAL_RECEIPTS = [
      { id: 'rec_1', merchant: 'AB Vassilopoulos Supermarket', date: '2026-11-02', category: 'Supermarket', memberId: 'mom', memberName: 'Μαμά', total: 48.65, tax: 6.20, paymentMethod: 'Card (Visa ****4821)', notes: 'Εβδομαδιαία ψώνια σπιτιού' },
      { id: 'rec_2', merchant: 'EKO Gas Station', date: '2026-11-04', category: 'Fuel & Transport', memberId: 'dad', memberName: 'Μπαμπάς', total: 55.00, tax: 10.65, paymentMethod: 'Card (Mastercard ****1102)', notes: 'Βενζίνη αυτοκινήτου' },
      { id: 'rec_3', merchant: 'Public Store / Βιβλία Σχολείου', date: '2026-11-05', category: 'Education & Hobbies', memberId: 'child1', memberName: 'Παιδί 1 (Αλέξανδρος)', total: 34.80, tax: 2.10, paymentMethod: 'Cash', notes: 'Σχολικά είδη' }
    ];

    function App() {
      const [receipts, setReceipts] = useState(() => {
        const saved = localStorage.getItem('family_receipts_v3');
        return saved ? JSON.parse(saved) : INITIAL_RECEIPTS;
      });

      const [members] = useState(DEFAULT_MEMBERS);
      const [selectedMember, setSelectedMember] = useState('dad');
      const [isScanning, setIsScanning] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [memberFilter, setMemberFilter] = useState('All');

      const cameraInputRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('family_receipts_v3', JSON.stringify(receipts));
      }, [receipts]);

      const exportToExcel = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;

        const wb = XLSX.utils.book_new();
        const receiptRows = receipts.map((r) => ({
          'ID': r.id,
          'Ημερομηνία': r.date,
          'Κατάστημα': r.merchant,
          'Κατηγορία': r.category,
          'Μέλος': r.memberName,
          'Σύνολο (€)': r.total,
          'Τρόπος Πληρωμής': r.paymentMethod,
          'Σημειώσεις': r.notes || ''
        }));
        const ws1 = XLSX.utils.json_to_sheet(receiptRows);
        XLSX.utils.book_append_sheet(wb, ws1, 'Αποδείξεις');

        XLSX.writeFile(wb, `Family_Expenses_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsScanning(true);
        setTimeout(() => {
          const mObj = members.find((m) => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_${Date.now()}`,
            merchant: 'Νέο Κατάστημα (Σάρωση)',
            date: new Date().toISOString().slice(0, 10),
            category: 'Supermarket',
            memberId: mObj.id,
            memberName: mObj.name,
            total: 24.50,
            tax: 3.20,
            paymentMethod: 'Card',
            notes: 'Καταχωρήθηκε από κινητό'
          };
          setReceipts((prev) => [newRec, ...prev]);
          setIsScanning(false);
        }, 1000);
      };

      const filteredReceipts = useMemo(() => {
        return receipts.filter((r) => {
          const matchesSearch = r.merchant.toLowerCase().includes(searchTerm.toLowerCase()) || r.memberName.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = categoryFilter === 'All' || r.category === categoryFilter;
          const matchesMember = memberFilter === 'All' || r.memberId === memberFilter;
          return matchesSearch && matchesCategory && matchesMember;
        });
      }, [receipts, searchTerm, categoryFilter, memberFilter]);

      const grandTotal = useMemo(() => receipts.reduce((acc, r) => acc + r.total, 0), [receipts]);

      return (
        <div className="min-h-screen pb-12">
          <input type="file" ref={cameraInputRef} onChange={handleFileUpload} accept="image/*" capture="environment" className="hidden" />
          <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*" className="hidden" />

          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-600 text-white rounded-2xl shadow-lg">
                  ✨
                </div>
                <div>
                  <h1 className="text-xl font-black text-indigo-600">Family Receipt Manager</h1>
                  <p className="text-xs text-slate-500">Διαχείριση Αποδείξεων & Εξαγωγή σε Excel</p>
                </div>
              </div>
              <button onClick={exportToExcel} className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-md transition">
                📥 Export Excel (.xlsx)
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
            {/* Upload Section */}
            <section className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b">
                <div>
                  <h2 className="text-base font-bold">📸 Προσθήκη Απόδειξης</h2>
                  <p className="text-xs text-slate-400">Επιλέξτε μέλος και τραβήξτε φωτογραφία</p>
                </div>
                <div className="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-2xl flex-wrap gap-1">
                  {members.map((m) => (
                    <button
                      key={m.id}
                      onClick={() => setSelectedMember(m.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${selectedMember === m.id ? `${m.color}` : 'text-slate-600 hover:bg-slate-200'}`}
                    >
                      {m.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button
                  onClick={() => cameraInputRef.current?.click()}
                  disabled={isScanning}
                  className="p-5 rounded-2xl border-2 border-dashed border-indigo-400 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 flex flex-col items-center justify-center space-y-2 transition"
                >
                  <span className="text-2xl">📸</span>
                  <span className="font-bold text-sm">Φωτογραφία από Κάμερα Κινητού</span>
                </button>
                <button
                  onClick={() => fileInputRef.current?.click()}
                  disabled={isScanning}
                  className="p-5 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 flex flex-col items-center justify-center space-y-2 transition"
                >
                  <span className="text-2xl">🖼️</span>
                  <span className="font-bold text-sm">Επιλογή από Συλλογή / Αρχεία</span>
                </button>
              </div>

              {isScanning && <p className="text-xs font-bold text-indigo-600 animate-pulse text-center">Σάρωση απόδειξης...</p>}
            </section>

            {/* Total Spending */}
            <section className="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg flex items-center justify-between">
              <div>
                <span className="text-xs font-medium text-indigo-200 uppercase tracking-wider">Συνολικά Έξοδα Οικογένειας</span>
                <h3 className="text-3xl font-black">€{grandTotal.toFixed(2)}</h3>
              </div>
              <div className="text-right text-xs text-indigo-200">
                {receipts.length} Καταχωρημένες Αποδείξεις
              </div>
            </section>

            {/* Receipts Table */}
            <section className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                <h3 className="font-bold text-sm">Λίστα Αποδείξεων ({filteredReceipts.length})</h3>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="bg-slate-50 text-slate-400 text-[11px] uppercase font-semibold border-b border-slate-100">
                      <th className="py-3 px-4">Ημερομηνία</th>
                      <th className="py-3 px-4">Κατάστημα</th>
                      <th className="py-3 px-4">Κατηγορία</th>
                      <th className="py-3 px-4">Μέλος</th>
                      <th className="py-3 px-4 text-right">Ποσό (€)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredReceipts.map((r) => {
                      const mObj = members.find((m) => m.id === r.memberId);
                      return (
                        <tr key={r.id} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono text-xs text-slate-500">{r.date}</td>
                          <td className="py-3 px-4 font-bold text-slate-800">{r.merchant}</td>
                          <td className="py-3 px-4">
                            <span className="px-2 py-0.5 rounded text-xs border bg-slate-100">{r.category}</span>
                          </td>
                          <td className="py-3 px-4">
                            <span className={`px-2 py-0.5 rounded-full text-[11px] font-bold border ${mObj?.badge || ''}`}>
                              {r.memberName}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right font-black text-slate-900">€{r.total.toFixed(2)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
