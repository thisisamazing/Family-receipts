<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Receipt Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS for Excel Exports & Imports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_MEMBERS = [
      { id: 'dad', name: 'Μπαμπάς', role: 'Γονέας', color: 'bg-blue-600 text-white', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'mom', name: 'Μαμά', role: 'Γονέας', color: 'bg-rose-600 text-white', badge: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'child1', name: 'Παιδί 1 (Αλέξανδρος)', role: 'Παιδί', color: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'child2', name: 'Παιδί 2 (Μαρία)', role: 'Παιδί', color: 'bg-purple-600 text-white', badge: 'bg-purple-100 text-purple-800 border-purple-300' }
    ];

    const CATEGORIES = [
      { id: 'Supermarket', label: 'Supermarket / Τρόφιμα', icon: '🛒', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      { id: 'Fuel & Transport', label: 'Καύσιμο Αυτοκινήτου', icon: '⛽', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      { id: 'Dining & Coffee', label: 'Εστίαση / Φαγητό Έξω', icon: '🍔', color: 'bg-rose-100 text-rose-800 border-rose-300' },
      { id: 'Health & Pharmacy', label: 'Φάρμακα / Ιατρικά', icon: '💊', color: 'bg-teal-100 text-teal-800 border-teal-300' },
      { id: 'Utilities & Bills', label: 'Utilities & Bills / Λογαριασμοί', icon: '⚡', color: 'bg-purple-100 text-purple-800 border-purple-300' },
      { id: 'Education & Hobbies', label: 'Σχολικά / Φροντιστήρια', icon: '📚', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      { id: 'Allowance', label: 'Χαρτζιλίκι', icon: '💵', color: 'bg-green-100 text-green-800 border-green-300' },
      { id: 'Rent', label: 'Ενοίκιο', icon: '🏠', color: 'bg-blue-100 text-blue-800 border-blue-300' },
      { id: 'Shopping & Gifts', label: 'Ψώνια & Δώρα', icon: '🎁', color: 'bg-pink-100 text-pink-800 border-pink-300' },
      { id: 'Cigarettes', label: 'Τσιγάρα', icon: '🚬', color: 'bg-stone-100 text-stone-800 border-stone-300' },
      { id: 'Uncategorized', label: 'Διάφορα (Προς Ταξινόμηση)', icon: '❓', color: 'bg-orange-100 text-orange-800 border-orange-300' }
    ];

    const INITIAL_RECEIPTS = [
      { id: 'rec_1', merchant: 'AB Vassilopoulos', date: '2026-11-01', category: 'Supermarket', memberId: 'mom', memberName: 'Μαμά', total: 48.65, tax: 6.20, paymentMethod: 'Card', notes: 'Ψώνια εβδομάδας' },
      { id: 'rec_2', merchant: 'EKO Gas Station', date: '2026-11-02', category: 'Fuel & Transport', memberId: 'dad', memberName: 'Μπαμπάς', total: 55.00, tax: 10.65, paymentMethod: 'Card', notes: 'Βενζίνη' },
      { id: 'rec_3', merchant: 'Φροντιστήριο Αγγλικών', date: '2026-11-03', category: 'Education & Hobbies', memberId: 'child1', memberName: 'Παιδί 1 (Αλέξανδρος)', total: 80.00, tax: 0, paymentMethod: 'Bank Transfer', notes: 'Δίδακτρα Νοεμβρίου' },
      { id: 'rec_4', merchant: 'Ενοίκιο Σπιτιού', date: '2026-11-04', category: 'Rent', memberId: 'dad', memberName: 'Μπαμπάς', total: 450.00, tax: 0, paymentMethod: 'Direct Order / Πάγια', notes: 'Μηνιαίο ενοίκιο' },
      { id: 'rec_5', merchant: 'Χαρτζιλίκι Αλέξανδρου', date: '2026-11-05', category: 'Allowance', memberId: 'child1', memberName: 'Παιδί 1 (Αλέξανδρος)', total: 15.00, tax: 0, paymentMethod: 'Cash', notes: 'Εβδομαδιαίο χαρτζιλίκι' },
      { id: 'rec_6', merchant: 'Περίπτερο / Τσιγάρα', date: '2026-11-06', category: 'Cigarettes', memberId: 'dad', memberName: 'Μπαμπάς', total: 4.60, tax: 0, paymentMethod: 'Cash', notes: '' },
      { id: 'rec_7', merchant: 'Pharmacy Central', date: '2026-11-07', category: 'Health & Pharmacy', memberId: 'child2', memberName: 'Μαρία', total: 22.40, tax: 1.30, paymentMethod: 'Card', notes: 'Βιταμίνες' },
      { id: 'rec_8', merchant: 'Αγορά Δώρου', date: '2026-11-08', category: 'Shopping & Gifts', memberId: 'mom', memberName: 'Μαμά', total: 35.00, tax: 6.70, paymentMethod: 'Card', notes: 'Δώρο γενεθλίων' }
    ];

    function App() {
      const [receipts, setReceipts] = useState(() => {
        const saved = localStorage.getItem('family_receipts_v6');
        return saved ? JSON.parse(saved) : INITIAL_RECEIPTS;
      });

      const [members] = useState(DEFAULT_MEMBERS);
      const [selectedMember, setSelectedMember] = useState('dad');
      const [isScanning, setIsScanning] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [memberFilter, setMemberFilter] = useState('All');
      const [isListening, setIsListening] = useState(false);

      const cameraInputRef = useRef(null);
      const fileInputRef = useRef(null);
      const excelImportRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('family_receipts_v6', JSON.stringify(receipts));
      }, [receipts]);

      const downloadTemplate = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;
        const wb = XLSX.utils.book_new();
        const templateRows = [
          { 'Ημερομηνία (YYYY-MM-DD)': '2026-11-01', 'Κατάστημα / Περιγραφή': 'AB Vassilopoulos', 'Κατηγορία': 'Supermarket', 'Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)': 'Μαμά', 'Σύνολο (€)': 48.65, 'Τρόπος Πληρωμής': 'Card', 'Σημειώσεις': 'Ψώνια' },
          { 'Ημερομηνία (YYYY-MM-DD)': '2026-11-02', 'Κατάστημα / Περιγραφή': 'Ενοίκιο', 'Κατηγορία': 'Rent', 'Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)': 'Μπαμπάς', 'Σύνολο (€)': 450.00, 'Τρόπος Πληρωμής': 'Πάγια', 'Σημειώσεις': 'Ενοίκιο Νοεμβρίου' }
        ];
        const ws = XLSX.utils.json_to_sheet(templateRows);
        XLSX.utils.book_append_sheet(wb, ws, 'Πρότυπο Εισαγωγής');
        XLSX.writeFile(wb, `Receipts_Template_Nov_1_to_8.xlsx`);
      };

      const handleExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const XLSX = window.XLSX;
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary' });
          const wsname = wb.SheetNames[0];
          const ws = wb.Sheets[wsname];
          const data = XLSX.utils.sheet_to_json(ws);

          const importedReceipts = data.map((row, index) => {
            const mName = row['Μέλος (Μπαμπάς/Μαμά/Παιδί 1/Παιδί 2)'] || row['Μέλος'] || 'Μπαμπάς';
            const mObj = members.find(m => m.name.toLowerCase().includes(mName.toLowerCase())) || members[0];
            return {
              id: `rec_imp_${Date.now()}_${index}`,
              merchant: row['Κατάστημα / Περιγραφή'] || row['Κατάστημα'] || 'Εισαγωγή Excel',
              date: row['Ημερομηνία (YYYY-MM-DD)'] || row['Ημερομηνία'] || new Date().toISOString().slice(0, 10),
              category: row['Κατηγορία'] || 'Uncategorized',
              memberId: mObj.id,
              memberName: mObj.name,
              total: parseFloat(row['Σύνολο (€)'] || row['Σύνολο'] || 0),
              tax: 0,
              paymentMethod: row['Τρόπος Πληρωμής'] || 'Μετρητά',
              notes: row['Σημειώσεις'] || 'Εισαγωγή από Excel'
            };
          });

          setReceipts((prev) => [...importedReceipts, ...prev]);
          alert(`Εισήχθησαν επιτυχώς ${importedReceipts.length} εγγραφές!`);
        };
        reader.readAsBinaryString(file);
      };

      const exportToExcel = () => {
        const XLSX = window.XLSX;
        if (!XLSX) return;

        const wb = XLSX.utils.book_new();
        const receiptRows = receipts.map((r) => ({
          'ID': r.id,
          'Ημερομηνία': r.date,
          'Κατάστημα / Περιγραφή': r.merchant,
          'Κατηγορία': r.category,
          'Μέλος': r.memberName,
          'Σύνολο (€)': r.total,
          'Τρόπος Πληρωμής': r.paymentMethod,
          'Σημειώσεις': r.notes || ''
        }));
        const ws1 = XLSX.utils.json_to_sheet(receiptRows);
        XLSX.utils.book_append_sheet(wb, ws1, 'Αποδείξεις');

        XLSX.writeFile(wb, `Family_Expenses_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      const handleVoiceInput = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('Η φωνητική αναγνώριση δεν υποστηρίζεται στο πρόγραμμα περιήγησής σας.');
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'el-GR';

        setIsListening(true);
        recognition.start();

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setIsListening(false);
          alert(`Ακούστηκε: "${transcript}"`);

          const currentMember = members.find(m => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_voice_${Date.now()}`,
            merchant: transcript,
            date: new Date().toISOString().slice(0, 10),
            category: 'Uncategorized',
            memberId: currentMember.id,
            memberName: currentMember.name,
            total: 10.00,
            tax: 0,
            paymentMethod: 'Φωνητική Καταχώρηση',
            notes: `Φωνητικό: ${transcript}`
          };
          setReceipts(prev => [newRec, ...prev]);
        };

        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
      };

      const addQuickExpense = (category, defaultName, defaultAmount) => {
        const mObj = members.find((m) => m.id === selectedMember) || members[0];
        const newRec = {
          id: `rec_quick_${Date.now()}`,
          merchant: defaultName,
          date: new Date().toISOString().slice(0, 10),
          category: category,
          memberId: mObj.id,
          memberName: mObj.name,
          total: defaultAmount,
          tax: 0,
          paymentMethod: 'Πάγια / Μετρητά',
          notes: 'Γρήγορη καταχώρηση χωρίς απόδειξη'
        };
        setReceipts(prev => [newRec, ...prev]);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsScanning(true);
        setTimeout(() => {
          const mObj = members.find((m) => m.id === selectedMember) || members[0];
          const newRec = {
            id: `rec_${Date.now()}`,
            merchant: 'Νέα Απόδειξη (Σάρωση)',
            date: new Date().toISOString().slice(0, 10),
            category: 'Uncategorized',
            memberId: mObj.id,
            memberName: mObj.name,
            total: 24.50,
            tax: 3.20,
            paymentMethod: 'Card',
            notes: 'Σαρώθηκε από φωτογραφία'
          };
          setReceipts((prev) => [newRec, ...prev]);
          setIsScanning(false);
        }, 1000);
      };

      const changeCategory = (receiptId, newCat) => {
        setReceipts(prev => prev.map(r => r.id === receiptId ? { ...r, category: newCat } : r));
      };

      const deleteReceipt = (id) => {
        setReceipts((prev) => prev.filter((r) => r.id !== id));
      };

      const grandTotal = useMemo(() => receipts.reduce((acc, r) => acc + r.total, 0), [receipts]);

      const memberBreakdown = useMemo(() => {
        return members.map((m) => {
          const mRecs = receipts.filter((r) => r.memberId === m.id);
          const sum = mRecs.reduce((acc, r) => acc + r.total, 0);
          const percent = grandTotal > 0 ? (sum / grandTotal) * 100 : 0;
          return { ...m, count: mRecs.length, total: sum, percent };
        });
      }, [receipts, members, grandTotal]);

      const categoryBreakdown = useMemo(() => {
        return CATEGORIES.map((cat) => {
          const catRecs = receipts.filter((r) => r.category === cat.id);
          const sum = catRecs.reduce((acc, r) => acc + r.total, 0);
          const percent = grandTotal > 0 ? (sum / grandTotal) * 100 : 0;
          return { ...cat, count: catRecs.length, total: sum, percent };
        });
      }, [receipts, grandTotal]);

      const dateBreakdown = useMemo(() => {
        const map = {};
        receipts.forEach((r) => {
          if (!map[r.date]) map[r.date] = 0;
          map[r.date] += r.total;
        });
        return Object.keys(map).sort().reverse().map(d => ({ date: d, total: map[d] }));
      }, [receipts]);

      const filteredReceipts = useMemo(() => {
        return receipts.filter((r) => {
          const matchesSearch = r.merchant.toLowerCase().includes(searchTerm.toLowerCase()) || r.memberName.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = categoryFilter === 'All' || r.category === categoryFilter;
          const matchesMember = memberFilter === 'All' || r.memberId === memberFilter;
          return matchesSearch && matchesCategory && matchesMember;
        });
      }, [receipts, searchTerm, categoryFilter, memberFilter]);

      const uncategorizedReceipts = useMemo(() => {
        return receipts.filter(r => r.category === 'Uncategorized');
      }, [receipts]);

      return (
        <div className="min-h-screen pb-16">
          <input type="file" ref={cameraInputRef} onChange={handleFileUpload} accept="image/*" capture="environment" className="hidden" />
          <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="image/*" className="hidden" />
          <input type="file" ref={excelImportRef} onChange={handleExcelImport} accept=".xlsx,.xls" className="hidden" />

          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-600 text-white rounded-2xl shadow-lg">
                  ✨
                </div>
                <div>
                  <h1 className="text-xl font-black text-indigo-600">Family Receipt Manager</h1>
                  <p className="text-xs text-slate-500">Νέες Κατηγορίες & Φωνητική Καταχώρηση</p>
                </div>
              </div>

              <div className="flex items-center space-x-2 w-full sm:w-auto flex-wrap gap-y-2">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  📊 Dashboard & Στατιστικά
                </button>
                <button
                  onClick={() => setActiveTab('receipts')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'receipts' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  🧾 Λίστα ({receipts.length})
                </button>
                <button onClick={exportToExcel} className="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md transition">
                  📥 Export Excel
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">

            {/* Excel Import Card */}
            <section className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-5 rounded-3xl shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <h3 className="font-extrabold text-sm flex items-center gap-2">
                  <span>📥 Μαζική Εισαγωγή Εξόδων 1-8 Νοεμβρίου</span>
                </h3>
                <p className="text-xs text-blue-200 mt-1">Κατεβάστε το πρότυπο Excel, συμπληρώστε τα παλιά έξοδα και εισάγετέ τα με 1 κλικ!</p>
              </div>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button onClick={downloadTemplate} className="flex-1 sm:flex-none px-3 py-2 rounded-xl bg-blue-700 hover:bg-blue-600 text-white text-xs font-bold transition">
                  📄 Πρότυπο Excel
                </button>
                <button onClick={() => excelImportRef.current?.click()} className="flex-1 sm:flex-none px-3 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 text-xs font-black transition shadow-md">
                  📤 Import Excel
                </button>
              </div>
            </section>

            {/* Quick Non-Receipt Adders & Voice Input */}
            <section className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <div className="flex items-center justify-between border-b pb-3">
                <div>
                  <h2 className="text-base font-bold text-slate-800">⚡ Γρήγορη Καταχώρηση Χωρίς Απόδειξη</h2>
                  <p className="text-xs text-slate-400">Πληρωμές με πάγιες εντολές, μετρητά, χαρτζιλίκια ή φωνή</p>
                </div>
                <button
                  onClick={handleVoiceInput}
                  className={`px-4 py-2 rounded-2xl text-xs font-bold flex items-center gap-2 transition ${isListening ? 'bg-red-600 text-white animate-bounce' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
                >
                  <span>🎤</span>
                  <span>{isListening ? 'Ακούω...' : 'Φωνητική Εγγραφή'}</span>
                </button>
              </div>

              {/* Active Member Selection */}
              <div className="flex items-center space-x-2 bg-slate-100 p-2 rounded-2xl flex-wrap gap-1">
                <span className="text-xs font-bold text-slate-500">Μέλος:</span>
                {members.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => setSelectedMember(m.id)}
                    className={`px-3 py-1 rounded-xl text-xs font-bold transition ${selectedMember === m.id ? `${m.color}` : 'text-slate-600 hover:bg-slate-200'}`}
                  >
                    {m.name}
                  </button>
                ))}
              </div>

              {/* Action Buttons */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button onClick={() => addQuickExpense('Rent', 'Ενοίκιο Σπιτιού', 450.00)} className="p-3 bg-blue-50 border border-blue-200 rounded-2xl text-left hover:bg-blue-100 transition">
                  <span className="text-lg block">🏠</span>
                  <span className="text-xs font-bold text-blue-900 block">Ενοίκιο</span>
                  <span className="text-[10px] text-blue-600 font-semibold">Πάγια Εντολή</span>
                </button>
                <button onClick={() => addQuickExpense('Allowance', 'Χαρτζιλίκι', 15.00)} className="p-3 bg-green-50 border border-green-200 rounded-2xl text-left hover:bg-green-100 transition">
                  <span className="text-lg block">💵</span>
                  <span className="text-xs font-bold text-green-900 block">Χαρτζιλίκι</span>
                  <span className="text-[10px] text-green-600 font-semibold">Μετρητά</span>
                </button>
                <button onClick={() => addQuickExpense('Cigarettes', 'Τσιγάρα / Περίπτερο', 4.60)} className="p-3 bg-stone-50 border border-stone-200 rounded-2xl text-left hover:bg-stone-100 transition">
                  <span className="text-lg block">🚬</span>
                  <span className="text-xs font-bold text-stone-900 block">Τσιγάρα</span>
                  <span className="text-[10px] text-stone-600 font-semibold">Μετρητά</span>
                </button>
                <button onClick={() => addQuickExpense('Utilities & Bills', 'Κοινόχρηστα / Λογαριασμός', 35.00)} className="p-3 bg-purple-50 border border-purple-200 rounded-2xl text-left hover:bg-purple-100 transition">
                  <span className="text-lg block">⚡</span>
                  <span className="text-xs font-bold text-purple-900 block">Κοινόχρηστα</span>
                  <span className="text-[10px] text-purple-600 font-semibold">Πληρωμή</span>
                </button>
              </div>

              {/* Standard Photo Receipt Upload */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <button onClick={() => cameraInputRef.current?.click()} disabled={isScanning} className="p-3 rounded-2xl border border-dashed border-indigo-400 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center gap-2">
                  <span>📸 Φωτογραφία Απόδειξης</span>
                </button>
                <button onClick={() => fileInputRef.current?.click()} disabled={isScanning} className="p-3 rounded-2xl border border-dashed border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center gap-2">
                  <span>🖼️ Επιλογή από Συλλογή</span>
                </button>
              </div>
            </section>

            {/* Uncategorized Items Warning & Re-classifier Banner */}
            {uncategorizedReceipts.length > 0 && (
              <section className="bg-orange-50 border border-orange-200 p-4 rounded-3xl space-y-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">❓</span>
                    <div>
                      <h4 className="text-xs font-bold text-orange-900">Έχετε {uncategorizedReceipts.length} έξοδα στα "Διάφορα (Προς Ταξινόμηση)"</h4>
                      <p className="text-[11px] text-orange-700">Επιλέξτε τη σωστή κατηγορία για να ενημερωθούν τα στατιστικά σας.</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-2">
                  {uncategorizedReceipts.map(r => (
                    <div key={r.id} className="p-2.5 bg-white rounded-2xl border border-orange-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                      <div>
                        <span className="font-bold text-xs text-slate-800">{r.merchant}</span>
                        <span className="text-[10px] text-slate-400 block">{r.date} — €{r.total.toFixed(2)} ({r.memberName})</span>
                      </div>
                      <div className="flex items-center gap-1 flex-wrap">
                        {CATEGORIES.filter(c => c.id !== 'Uncategorized').map(cat => (
                          <button
                            key={cat.id}
                            onClick={() => changeCategory(r.id, cat.id)}
                            className="px-2 py-1 rounded-lg bg-slate-100 hover:bg-indigo-100 text-[10px] font-bold text-slate-700 hover:text-indigo-700 border border-slate-200 transition"
                          >
                            {cat.icon} {cat.label.split('/')[0]}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* Grand Total Display */}
            <section className="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white p-6 rounded-3xl shadow-lg flex items-center justify-between">
              <div>
                <span className="text-xs font-medium text-indigo-200 uppercase tracking-wider">Συνολικά Έξοδα Οικογένειας</span>
                <h3 className="text-3xl font-black mt-1">€{grandTotal.toFixed(2)}</h3>
              </div>
              <div className="text-right text-xs text-indigo-200">
                <span className="block text-2xl font-bold text-white">{receipts.length}</span>
                Εγγραφές
              </div>
            </section>

            {/* TAB CONTENT */}
            {activeTab === 'dashboard' ? (
              <div className="space-y-6">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                  {/* 1. EXPENSES BY MEMBER */}
                  <section className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="font-bold text-base text-slate-800">👨‍👩‍👧‍👦 Έξοδα ανά Μέλος</h3>
                      <span className="text-xs text-slate-400">Κατανομή</span>
                    </div>

                    <div className="space-y-4">
                      {memberBreakdown.map((m) => (
                        <div key={m.id} className="space-y-1.5">
                          <div className="flex justify-between items-center text-xs font-bold">
                            <span className="flex items-center gap-2">
                              <span className={`px-2 py-0.5 rounded text-[10px] ${m.badge}`}>{m.name}</span>
                              <span className="text-slate-400 font-normal">({m.count} έξοδα)</span>
                            </span>
                            <span className="font-black text-slate-800">€{m.total.toFixed(2)} ({m.percent.toFixed(1)}%)</span>
                          </div>
                          <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div className="h-full bg-indigo-500 transition-all duration-500" style={{ width: `${m.percent}%` }}></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* 2. EXPENSES BY CATEGORY */}
                  <section className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between border-b pb-3">
                      <h3 className="font-bold text-base text-slate-800">🏷️ Έξοδα ανά Κατηγορία</h3>
                      <span className="text-xs text-slate-400">Νέες Κατηγορίες</span>
                    </div>

                    <div className="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                      {categoryBreakdown.map((cat) => (
                        <div key={cat.id} className="p-3 rounded-2xl border border-slate-100 bg-slate-50 flex items-center justify-between">
                          <div className="flex items-center space-x-3">
                            <span className="text-xl">{cat.icon}</span>
                            <div>
                              <p className="text-xs font-bold text-slate-800">{cat.label}</p>
                              <p className="text-[10px] text-slate-400">{cat.count} εγγραφές</p>
                            </div>
                          </div>
                          <div className="text-right">
                            <p className="text-sm font-black text-slate-900">€{cat.total.toFixed(2)}</p>
                            <p className="text-[10px] text-slate-400">{cat.percent.toFixed(1)}%</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>

                {/* 3. EXPENSES BY DATE */}
                <section className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between border-b pb-3">
                    <h3 className="font-bold text-base text-slate-800">📅 Ιστορικό Εξόδων ανά Ημερομηνία (1-8 Νοεμβρίου)</h3>
                    <span className="text-xs text-slate-400">Ημερήσιο Σύνολο</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                    {dateBreakdown.map((item) => (
                      <div key={item.date} className="p-2.5 bg-indigo-50 border border-indigo-100 rounded-2xl text-center">
                        <span className="text-[10px] font-bold text-indigo-600 block">{item.date}</span>
                        <span className="text-xs font-black text-slate-900 mt-1 block">€{item.total.toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            ) : (
              /* RECEIPTS LIST TAB */
              <section className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden space-y-4 p-5">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input
                    type="text"
                    placeholder="Αναζήτηση..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-xs"
                  />
                  <select
                    value={memberFilter}
                    onChange={(e) => setMemberFilter(e.target.value)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-xs"
                  >
                    <option value="All">Όλα τα Μέλη</option>
                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                  </select>
                  <select
                    value={categoryFilter}
                    onChange={(e) => setCategoryFilter(e.target.value)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-xs"
                  >
                    <option value="All">Όλες οι Κατηγορίες</option>
                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-50 text-slate-400 text-[11px] uppercase font-semibold border-b border-slate-100">
                        <th className="py-3 px-4">Ημερομηνία</th>
                        <th className="py-3 px-4">Περιγραφή</th>
                        <th className="py-3 px-4">Κατηγορία</th>
                        <th className="py-3 px-4">Μέλος</th>
                        <th className="py-3 px-4 text-right">Ποσό (€)</th>
                        <th className="py-3 px-4 text-center">Διαγραφή</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredReceipts.map((r) => {
                        const mObj = members.find((m) => m.id === r.memberId);
                        const cObj = CATEGORIES.find((c) => c.id === r.category);
                        return (
                          <tr key={r.id} className="hover:bg-slate-50">
                            <td className="py-3 px-4 font-mono text-xs text-slate-500">{r.date}</td>
                            <td className="py-3 px-4 font-bold text-slate-800">{r.merchant}</td>
                            <td className="py-3 px-4">
                              <span className={`px-2 py-0.5 rounded text-xs border ${cObj?.color || 'bg-slate-100'}`}>
                                {cObj?.icon} {cObj?.label || r.category}
                              </span>
                            </td>
                            <td className="py-3 px-4">
                              <span className={`px-2 py-0.5 rounded-full text-[11px] font-bold border ${mObj?.badge || ''}`}>
                                {r.memberName}
                              </span>
                            </td>
                            <td className="py-3 px-4 text-right font-black text-slate-900">€{r.total.toFixed(2)}</td>
                            <td className="py-3 px-4 text-center">
                              <button onClick={() => deleteReceipt(r.id)} className="text-red-500 hover:text-red-700 text-xs font-bold">
                                🗑️
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
